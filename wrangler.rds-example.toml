# AWS RDS Configuration Example for wrangler.toml

# Add this section to your wrangler.toml to enable AWS RDS via Hyperdrive

## Option 1: Use Hyperdrive for AWS RDS (Recommended)
# Cloudflare Hyperdrive provides connection pooling and caching for database connections
# This significantly improves performance and reduces latency for database queries

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "your-hyperdrive-id-here" # Get this from: wrangler hyperdrive create

# To create Hyperdrive configuration:
# 1. Create an AWS RDS instance (PostgreSQL or MySQL)
# 2. Get the connection string:
#    postgres://username:password@host:5432/database?sslmode=require
# 3. Run: wrangler hyperdrive create ross-tax-prep-hyperdrive --connection-string="..."
# 4. Copy the ID from the output and paste it above

## Database Type Configuration
# Add to [vars] section to specify which database to use

[vars]
# ... existing vars ...
DB_TYPE = "rds" # Options: "d1" (default) or "rds"

# Note: When HYPERDRIVE binding is present, the application will automatically
# use AWS RDS. If not present, it falls back to Cloudflare D1.

