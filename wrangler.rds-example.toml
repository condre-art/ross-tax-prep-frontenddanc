## Security Best Practices

# 1. Never commit database credentials to git
# 2. Use wrangler secrets for sensitive data:
#    wrangler secret put RDS_PASSWORD
# 3. Enable SSL/TLS for RDS connections
# 4. Use IAM authentication for RDS (advanced)
# 5. Restrict security group to Cloudflare IP ranges

## Cost Comparison

# Cloudflare D1:
# - Free tier: 5GB storage, 5 million reads/day
# - Paid: $0.001 per 1,000 read operations
# - Best for: Small to medium deployments (< 500 clients)

# AWS RDS (PostgreSQL):
# - db.t4g.micro: ~$12/month (1 GB RAM, 20 GB storage)
# - db.t4g.small: ~$24/month (2 GB RAM, 20 GB storage)
# - Best for: Large deployments (500+ clients), advanced features

# Cloudflare Hyperdrive:
# - Currently in beta (free)
# - Pricing TBA
# - Provides connection pooling and edge caching

## Migration Path

# Phase 1: Start with D1 (simple, cost-effective)
# Phase 2: Add Hyperdrive when scaling up
# Phase 3: Use both D1 and RDS for different workloads
# Phase 4: Full migration to RDS if needed

## Troubleshooting

# Issue: "No database binding found"
# Solution: Ensure either DB or HYPERDRIVE binding is configured

# Issue: Connection timeout to RDS
# Solution: Check security group allows Cloudflare IPs

# Issue: High latency
# Solution: Use Hyperdrive for connection pooling

# Issue: Database not found
# Solution: Verify database name in connection string matches RDS instance

